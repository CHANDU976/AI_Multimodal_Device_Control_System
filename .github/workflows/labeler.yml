# Labels each PR by the areas it touches (rules in .github/labeler.yml), so the
# PR list shows at a glance which module owners need to look.
#
# pull_request_target runs with the base branch's code and never checks out
# the PR, so it is safe for PRs from forks while still allowed to write labels.
name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
