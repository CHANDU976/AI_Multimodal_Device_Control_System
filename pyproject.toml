# Tooling configuration only — this repository is not an installable package.
# Runtime dependencies live in requirements.txt; test/CI ones in
# requirements-test.txt. See docs/ci-cd.md for how the pipeline uses these.

# ── pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# speech_module and Mousegesture use flat sibling imports (`from config import
# ...`, `import gesture_fsm`), exactly as when their scripts run standalone, so
# their directories go on sys.path next to the project root. `tests` makes the
# shared `helpers` package importable; `scripts/ci` exposes the CI tooling,
# which is tested like any other module.
pythonpath = [".", "speech_module", "Mousegesture", "tests", "scripts/ci"]
# importlib mode: test files in different folders may share a basename.
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: spawns real child processes or waits on real timers (seconds, not ms)",
    "ml: needs torch + transformers (the CI 'ml-tests' job installs them)",
    "models: needs real model weights fetched with Git LFS; skipped on pointer files",
]
# pytest-timeout: a hung child process or queue must fail the run, not stall CI.
timeout = 180
filterwarnings = [
    # torch / transformers deprecation chatter is not ours to fix.
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::FutureWarning:transformers.*",
]

# ── coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
relative_files = true
# Follow the child interpreters the supervisor/runner/CLI tests launch, so the
# JSON-lines runners are measured too (coverage.py >= 7.10).
patch = ["subprocess"]
source = ["central_module", "speech_module", "Mousegesture"]
omit = [
    # Stale snapshots of the engine and monitor, kept for reference only
    # (see Mousegesture/README.md) — not part of the product.
    "Mousegesture/test.py",
    "Mousegesture/testmoniter.py",
]

[tool.coverage.report]
skip_empty = true
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

# ── ruff ───────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = [
    ".venv",
    "Mousegesture/test.py",
    "Mousegesture/testmoniter.py",
    "pr-reports",
]

[tool.ruff.lint]
# BLOCKING set — must stay clean for a PR to merge. These are the checks that
# mean "this code is broken", not "this code is untidy": syntax errors,
# undefined names, invalid comparisons, redefinitions. The broader advisory
# set (E, W, F, B) is reported in the PR report without failing the build.
select = ["E9", "F63", "F7", "F82", "F811"]
